[project]
name = "pea-radar-backend"
version = "0.1.0"
description = "API d'analyse d'opportunités boursières éligibles PEA et de simulation de portefeuille"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pandas>=2.2",
    "numpy>=2.0",
    "yfinance>=0.2.65",
    "alembic>=1.20.1",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "E701", "E702"]
"migrations/*" = ["E501", "I", "UP"]
"app/market/provider.py" = ["S311"]
